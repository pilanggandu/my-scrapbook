<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cd"/>
      <stop offset="25%" stop-color="#dfb15b"/>
      <stop offset="50%" stop-color="#f9e596"/>
      <stop offset="75%" stop-color="#b88328"/>
      <stop offset="100%" stop-color="#e8c374"/>
    </linearGradient>

    <radialGradient id="velvetBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4d0e19"/>
      <stop offset="65%" stop-color="#30070e"/>
      <stop offset="100%" stop-color="#1c0307"/>
    </radialGradient>

    <filter id="goldShine" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffe699" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxurious Rounded Card Background -->
  <rect width="600" height="600" rx="36" fill="url(#velvetBg)"/>
  <rect x="24" y="24" width="552" height="552" rx="28" fill="none" stroke="url(#goldFoil)" stroke-width="2" opacity="0.45"/>
  <rect x="34" y="34" width="532" height="532" rx="22" fill="none" stroke="url(#goldFoil)" stroke-width="1" stroke-dasharray="8 6" opacity="0.35"/>

  <!-- Gold Emblem Elements -->
  <g filter="url(#goldShine)">
    <!-- Wreath Branches -->
    <path d="M 300 488 C 175 488 112 395 112 295 C 112 195 178 105 292 102" 
          fill="none" stroke="url(#goldFoil)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 300 488 C 425 488 488 395 488 295 C 488 195 422 105 308 102" 
          fill="none" stroke="url(#goldFoil)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Bottom Ribbon Knot -->
    <g transform="translate(300, 488)">
      <circle cx="0" cy="3" r="7" fill="url(#goldFoil)"/>
      <path d="M 0 0 C -16 -6 -32 -2 -34 10 C -36 22 -18 20 -3 6 Z" fill="url(#goldFoil)"/>
      <path d="M 0 0 C 16 -6 32 -2 34 10 C 36 22 18 20 3 6 Z" fill="url(#goldFoil)"/>
      <path d="M -4 4 C -12 14 -22 24 -36 28" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 4 4 C 12 14 22 24 36 28" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Gold Leaves & Berries -->
    <!-- Left Leaves -->
    <path d="M 205 440 Q 170 435 160 410 Q 190 410 208 432 Z" fill="url(#goldFoil)"/>
    <path d="M 152 380 Q 115 372 108 345 Q 140 347 154 372 Z" fill="url(#goldFoil)"/>
    <path d="M 124 300 Q 85 292 80 265 Q 112 267 128 292 Z" fill="url(#goldFoil)"/>
    <path d="M 136 215 Q 102 200 104 173 Q 134 180 144 208 Z" fill="url(#goldFoil)"/>
    <path d="M 185 145 Q 158 125 168 100 Q 194 113 195 140 Z" fill="url(#goldFoil)"/>
    <path d="M 248 108 Q 230 80 248 67 Q 268 85 258 108 Z" fill="url(#goldFoil)"/>

    <circle cx="218" cy="455" r="7" fill="url(#goldFoil)"/>
    <circle cx="160" cy="398" r="7" fill="url(#goldFoil)"/>
    <circle cx="128" cy="320" r="7" fill="url(#goldFoil)"/>
    <circle cx="138" cy="235" r="7" fill="url(#goldFoil)"/>
    <circle cx="192" cy="165" r="7" fill="url(#goldFoil)"/>

    <!-- Right Leaves -->
    <path d="M 395 440 Q 430 435 440 410 Q 410 410 392 432 Z" fill="url(#goldFoil)"/>
    <path d="M 448 380 Q 485 372 492 345 Q 460 347 446 372 Z" fill="url(#goldFoil)"/>
    <path d="M 476 300 Q 515 292 520 265 Q 488 267 472 292 Z" fill="url(#goldFoil)"/>
    <path d="M 464 215 Q 498 200 496 173 Q 466 180 456 208 Z" fill="url(#goldFoil)"/>
    <path d="M 415 145 Q 442 125 432 100 Q 406 113 405 140 Z" fill="url(#goldFoil)"/>
    <path d="M 352 108 Q 370 80 352 67 Q 332 85 342 108 Z" fill="url(#goldFoil)"/>

    <circle cx="382" cy="455" r="7" fill="url(#goldFoil)"/>
    <circle cx="440" cy="398" r="7" fill="url(#goldFoil)"/>
    <circle cx="472" cy="320" r="7" fill="url(#goldFoil)"/>
    <circle cx="462" cy="235" r="7" fill="url(#goldFoil)"/>
    <circle cx="408" cy="165" r="7" fill="url(#goldFoil)"/>

    <!-- Monogram Letters in Gold Foil -->
    <path d="M 282 232 C 274 223 263 218 249 218 C 220 218 196 242 196 282 C 196 324 221 348 252 348 C 278 348 294 334 297 308 L 254 308 L 254 288 L 319 288 L 319 314 C 314 338 289 369 249 369 C 205 369 171 334 171 282 C 171 230 206 197 252 197 C 273 197 290 205 302 218 Z" 
          fill="url(#goldFoil)"/>
    <path d="M 334 329 C 342 341 356 348 373 348 C 392 348 404 338 404 323 C 404 306 390 299 367 292 C 336 283 318 273 318 245 C 318 217 342 197 375 197 C 397 197 415 206 426 222 L 407 236 C 398 226 388 220 374 220 C 358 220 345 229 345 243 C 345 257 357 263 381 270 C 413 280 432 291 432 321 C 432 352 405 369 371 369 C 345 369 324 357 312 339 Z" 
          fill="url(#goldFoil)"/>

    <!-- Subtitle Text -->
    <text x="300" y="420" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="url(#goldFoil)" letter-spacing="5">GILANG &amp; SAKINAH</text>
    <text x="300" y="440" text-anchor="middle" font-family="sans-serif" font-size="8.5" fill="#e8c374" letter-spacing="3" opacity="0.85">MENJELANG AKAD NIKAH · 2026</text>
  </g>
</svg>