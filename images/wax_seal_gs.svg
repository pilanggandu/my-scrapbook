<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Maroon Wax Gradient -->
    <radialGradient id="waxBase" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#9e283d"/>
      <stop offset="45%" stop-color="#7a1829"/>
      <stop offset="85%" stop-color="#550e1b"/>
      <stop offset="100%" stop-color="#380710"/>
    </radialGradient>

    <!-- Inner Stamp Recess Gradient -->
    <radialGradient id="stampBed" cx="48%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#691220"/>
      <stop offset="70%" stop-color="#530c18"/>
      <stop offset="100%" stop-color="#3d0710"/>
    </radialGradient>

    <!-- Embossed Gold/Maroon Highlight for Relief -->
    <linearGradient id="embossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c94960"/>
      <stop offset="50%" stop-color="#9e283d"/>
      <stop offset="100%" stop-color="#4a0a14"/>
    </linearGradient>

    <!-- Heavy Realistic Wax Cast Shadow -->
    <filter id="waxShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#240409" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Inner Rim Inset Shadow -->
    <radialGradient id="innerRimGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#bd3e54" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#520c17" stop-opacity="0"/>
      <stop offset="100%" stop-color="#240308" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Wax Seal Outer Organic Puddle Edge -->
  <g filter="url(#waxShadow)">
    <path d="M 300 48 
             C 348 45, 385 58, 426 76 
             C 472 96, 514 135, 536 182 
             C 558 230, 552 278, 550 326 
             C 548 376, 532 422, 498 460 
             C 462 500, 412 534, 358 548 
             C 304 562, 246 550, 196 534 
             C 142 516, 92 478, 68 426 
             C 44 374, 48 322, 54 270 
             C 60 216, 82 164, 122 124 
             C 166 80, 240 52, 300 48 Z" 
          fill="url(#waxBase)" stroke="#380710" stroke-width="2"/>

    <!-- Organic Rim Melt Highlights (Liquid shine) -->
    <path d="M 132 136 C 180 88 250 62 316 58 C 360 55 408 68 442 86 C 410 74 358 66 312 70 C 238 76 172 108 128 152 C 104 176 88 214 82 250 C 80 220 96 168 132 136 Z" 
          fill="#ff859b" opacity="0.32"/>

    <path d="M 470 440 C 438 480 380 520 324 532 C 268 544 204 530 162 506 C 212 522 272 526 322 514 C 374 502 432 468 466 428 Z" 
          fill="#200307" opacity="0.5"/>

    <!-- Sunken Circular Matrix Bed (Where metal stamp pressed) -->
    <circle cx="300" cy="300" r="186" fill="url(#stampBed)" stroke="#3a0710" stroke-width="4"/>
    <!-- Stamp Rim Bevel & Inner Glow -->
    <circle cx="300" cy="300" r="186" fill="url(#innerRimGlow)"/>
    <circle cx="300" cy="300" r="183" fill="none" stroke="#250308" stroke-width="3" opacity="0.8"/>
    <circle cx="300" cy="300" r="180" fill="none" stroke="#bd3c52" stroke-width="1.8" opacity="0.5"/>

    <!-- Embossed Relief of GS Wreath and Monogram inside Seal -->
    <g transform="translate(300, 300) scale(0.68) translate(-300, -295)">
      <!-- Emboss Drop Shadow (creates raised 3D effect) -->
      <g filter="drop-shadow(0px 3px 2px rgba(25, 2, 6, 0.9))">
        <!-- Branches -->
        <path d="M 300 488 C 175 488 112 395 112 295 C 112 195 178 105 292 102" 
              fill="none" stroke="url(#embossHighlight)" stroke-width="5" stroke-linecap="round"/>
        <path d="M 300 488 C 425 488 488 395 488 295 C 488 195 422 105 308 102" 
              fill="none" stroke="url(#embossHighlight)" stroke-width="5" stroke-linecap="round"/>

        <!-- Bottom Ribbon Knot -->
        <circle cx="300" cy="491" r="9" fill="url(#embossHighlight)"/>
        <path d="M 300 488 C 280 480 262 485 260 498 C 258 510 278 510 295 494 Z" fill="url(#embossHighlight)"/>
        <path d="M 300 488 C 320 480 338 485 340 498 C 342 510 322 510 305 494 Z" fill="url(#embossHighlight)"/>
        <path d="M 296 492 C 286 505 274 516 260 522" fill="none" stroke="url(#embossHighlight)" stroke-width="3" stroke-linecap="round"/>
        <path d="M 304 492 C 314 505 326 516 340 522" fill="none" stroke="url(#embossHighlight)" stroke-width="3" stroke-linecap="round"/>

        <!-- Leaves & Berries Relief -->
        <!-- Left Side Nodes -->
        <path d="M 205 440 Q 180 435 170 415 Q 190 415 208 432 Z" fill="url(#embossHighlight)"/>
        <path d="M 152 380 Q 125 372 118 350 Q 140 352 154 372 Z" fill="url(#embossHighlight)"/>
        <path d="M 124 300 Q 95 292 90 270 Q 112 272 128 292 Z" fill="url(#embossHighlight)"/>
        <path d="M 136 215 Q 112 200 114 178 Q 134 185 144 208 Z" fill="url(#embossHighlight)"/>
        <path d="M 185 145 Q 168 125 178 105 Q 194 118 195 140 Z" fill="url(#embossHighlight)"/>
        <path d="M 248 108 Q 240 85 258 72 Q 268 90 258 108 Z" fill="url(#embossHighlight)"/>

        <!-- Left Berries -->
        <circle cx="218" cy="455" r="7" fill="url(#embossHighlight)"/>
        <circle cx="160" cy="398" r="7" fill="url(#embossHighlight)"/>
        <circle cx="128" cy="320" r="7" fill="url(#embossHighlight)"/>
        <circle cx="138" cy="235" r="7" fill="url(#embossHighlight)"/>
        <circle cx="192" cy="165" r="7" fill="url(#embossHighlight)"/>

        <!-- Right Side Nodes -->
        <path d="M 395 440 Q 420 435 430 415 Q 410 415 392 432 Z" fill="url(#embossHighlight)"/>
        <path d="M 448 380 Q 475 372 482 350 Q 460 352 446 372 Z" fill="url(#embossHighlight)"/>
        <path d="M 476 300 Q 505 292 510 270 Q 488 272 472 292 Z" fill="url(#embossHighlight)"/>
        <path d="M 464 215 Q 488 200 486 178 Q 466 185 456 208 Z" fill="url(#embossHighlight)"/>
        <path d="M 415 145 Q 432 125 422 105 Q 406 118 405 140 Z" fill="url(#embossHighlight)"/>
        <path d="M 352 108 Q 360 85 342 72 Q 332 90 342 108 Z" fill="url(#embossHighlight)"/>

        <!-- Right Berries -->
        <circle cx="382" cy="455" r="7" fill="url(#embossHighlight)"/>
        <circle cx="440" cy="398" r="7" fill="url(#embossHighlight)"/>
        <circle cx="472" cy="320" r="7" fill="url(#embossHighlight)"/>
        <circle cx="462" cy="235" r="7" fill="url(#embossHighlight)"/>
        <circle cx="408" cy="165" r="7" fill="url(#embossHighlight)"/>

        <!-- Monogram G S Embossed -->
        <!-- Letter G -->
        <path d="M 282 232 C 274 223 263 218 249 218 C 220 218 196 242 196 282 C 196 324 221 348 252 348 C 278 348 294 334 297 308 L 254 308 L 254 288 L 319 288 L 319 314 C 314 338 289 369 249 369 C 205 369 171 334 171 282 C 171 230 206 197 252 197 C 273 197 290 205 302 218 Z" 
              fill="url(#embossHighlight)"/>

        <!-- Letter S -->
        <path d="M 334 329 C 342 341 356 348 373 348 C 392 348 404 338 404 323 C 404 306 390 299 367 292 C 336 283 318 273 318 245 C 318 217 342 197 375 197 C 397 197 415 206 426 222 L 407 236 C 398 226 388 220 374 220 C 358 220 345 229 345 243 C 345 257 357 263 381 270 C 413 280 432 291 432 321 C 432 352 405 369 371 369 C 345 369 324 357 312 339 Z" 
              fill="url(#embossHighlight)"/>
      </g>

      <!-- Top Lip Emboss Highlight (Sunlight striking raised edges from top-left) -->
      <g opacity="0.55" fill="none" stroke="#ff99ab" stroke-width="1.6">
        <path d="M 249 218 C 220 218 196 242 196 282"/>
        <path d="M 375 197 C 397 197 415 206 426 222"/>
        <path d="M 367 292 C 336 283 318 273 318 245"/>
        <path d="M 292 102 C 178 105 112 195 112 295"/>
        <path d="M 422 105 Q 406 118 405 140"/>
      </g>
    </g>
  </g>
</svg>