<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Filter bayangan kartun halus -->
    <filter id="dressShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4a1823" flood-opacity="0.18"/>
    </filter>
    <filter id="standShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#3d2a23" flood-opacity="0.16"/>
    </filter>
    <radialGradient id="bgDressGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff8f9"/>
      <stop offset="65%" stop-color="#faedf0"/>
      <stop offset="100%" stop-color="#f2dde2"/>
    </radialGradient>
    <linearGradient id="maroonBlouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b83552"/>
      <stop offset="40%" stop-color="#8d2038"/>
      <stop offset="100%" stop-color="#5a1020"/>
    </linearGradient>
    <linearGradient id="maroonSkirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#99233d"/>
      <stop offset="50%" stop-color="#7e1a30"/>
      <stop offset="100%" stop-color="#540e1e"/>
    </linearGradient>
    <linearGradient id="woodStand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89d7c"/>
      <stop offset="50%" stop-color="#dfbaa0"/>
      <stop offset="100%" stop-color="#a87a58"/>
    </linearGradient>
    <linearGradient id="goldSash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Latar Belakang Kartun Pastel Hangat -->
  <rect width="800" height="800" fill="url(#bgDressGlow)"/>

  <!-- Bingkai Dalam Kartun & Garis Putus-Putus -->
  <rect x="36" y="36" width="728" height="728" rx="28" fill="none" stroke="#e8c2cb" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- Polkadot & Hati Mengambang Kartun -->
  <g fill="#f2cbd3" opacity="0.5">
    <circle cx="100" cy="110" r="7"/>
    <circle cx="160" cy="85" r="5"/>
    <circle cx="680" cy="120" r="6"/>
    <circle cx="710" cy="190" r="8"/>
    <circle cx="95" cy="690" r="7"/>
    <circle cx="700" cy="680" r="6"/>
  </g>

  <!-- Hati Romantis Mengambang -->
  <path d="M140 230 C140 210 115 200 100 220 C85 200 60 210 60 230 C60 255 100 275 100 275 C100 275 140 255 140 230 Z" fill="#eb7d94" opacity="0.75" transform="rotate(-15 100 235)"/>
  <path d="M710 260 C710 245 690 238 680 252 C670 238 650 245 650 260 C650 280 680 295 680 295 C680 295 710 280 710 260 Z" fill="#ea8d9e" opacity="0.65" transform="rotate(12 680 265)"/>
  <path d="M660 480 C660 468 645 462 638 472 C630 462 615 468 615 480 C615 496 638 506 638 506 C638 506 660 496 660 480 Z" fill="#f09db0" opacity="0.6" transform="rotate(-8 638 480)"/>

  <!-- Sparkles Kilau Emas Kartun -->
  <g fill="#f59e0b" filter="drop-shadow(0 2px 4px #f59e0b40)">
    <path d="M190 170 Q190 192 212 192 Q190 192 190 214 Q190 192 168 192 Q190 192 190 170 Z"/>
    <path d="M640 160 Q640 185 665 185 Q640 185 640 210 Q640 185 615 185 Q640 185 640 160 Z"/>
    <path d="M140 450 Q140 468 158 468 Q140 468 140 486 Q140 468 122 468 Q140 468 140 450 Z"/>
    <circle cx="225" cy="165" r="4" fill="#fbbf24"/>
    <circle cx="670" cy="460" r="4.5" fill="#fbbf24"/>
  </g>

  <!-- Karpet Melingkar Lembut Tempat Berdiri Maneken -->
  <g filter="url(#standShadow)">
    <ellipse cx="400" cy="670" rx="270" ry="85" fill="#f4dfe4" stroke="#dab6bf" stroke-width="4"/>
    <ellipse cx="400" cy="667" rx="250" ry="75" fill="#fcf3f5"/>
    <ellipse cx="400" cy="667" rx="230" ry="65" fill="none" stroke="#e8c7cf" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>

  <!-- ==================== MANEKEN BUTIK KAYU (MANNEQUIN STAND) ==================== -->
  <g filter="url(#standShadow)">
    <!-- Alas Kaki Maneken Bundar -->
    <ellipse cx="400" cy="672" rx="90" ry="26" fill="url(#woodStand)" stroke="#784e31" stroke-width="4.5"/>
    <ellipse cx="400" cy="668" rx="82" ry="20" fill="#edd0b8"/>
    <!-- Tiang Kayu Bawah -->
    <rect x="390" y="520" width="20" height="150" rx="4" fill="url(#woodStand)" stroke="#784e31" stroke-width="4"/>

    <!-- Tiang Atas / Leher Maneken -->
    <rect x="392" y="210" width="16" height="55" rx="3" fill="url(#woodStand)" stroke="#784e31" stroke-width="3.5"/>
    <!-- Finial Kepala Kayu Maneken Berornamen -->
    <circle cx="400" cy="200" r="16" fill="url(#woodStand)" stroke="#784e31" stroke-width="4"/>
    <ellipse cx="400" cy="216" rx="22" ry="7" fill="url(#woodStand)" stroke="#784e31" stroke-width="3"/>
    <circle cx="396" cy="196" r="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- ==================== BAJU SET MAROON KARTUN ==================== -->
  <g filter="url(#dressShadow)">

    <!-- 1. ROK PLISIR MAROON (PLEATED MIDI SKIRT) -->
    <!-- Bentuk Rok Mengembang Anggun -->
    <g transform="translate(0, 0)">
      <!-- Latar Belakang Lipatan Rok Bawah -->
      <path d="M335 440 L465 440 L545 615 C485 640 315 640 255 615 Z" 
            fill="url(#maroonSkirt)" stroke="#380712" stroke-width="5" stroke-linejoin="round"/>

      <!-- Lipatan-Lipatan Plisir Kartun (Pleats dengan Variasi Cahaya) -->
      <!-- Plisir 1 (Kiri Luar) -->
      <path d="M338 440 L260 615 L295 623 L355 440 Z" fill="#6a1324" stroke="#380712" stroke-width="2.5"/>
      <!-- Plisir 2 -->
      <path d="M355 440 L295 623 L335 628 L375 440 Z" fill="#881e35" stroke="#380712" stroke-width="2.5"/>
      <!-- Plisir 3 (Tengah Kiri) -->
      <path d="M375 440 L335 628 L375 632 L395 440 Z" fill="#a42844" stroke="#380712" stroke-width="2.5"/>
      <!-- Plisir 4 (Tengah) -->
      <path d="M395 440 L375 632 L425 632 L405 440 Z" fill="#ba3350" stroke="#380712" stroke-width="2.5"/>
      <!-- Plisir 5 (Tengah Kanan) -->
      <path d="M405 440 L425 632 L465 628 L425 440 Z" fill="#9e233d" stroke="#380712" stroke-width="2.5"/>
      <!-- Plisir 6 -->
      <path d="M425 440 L465 628 L505 623 L445 440 Z" fill="#7e1a2f" stroke="#380712" stroke-width="2.5"/>
      <!-- Plisir 7 (Kanan Luar) -->
      <path d="M445 440 L505 623 L540 615 L462 440 Z" fill="#5c1020" stroke="#380712" stroke-width="2.5"/>

      <!-- Garis Kilau Kartun Pada Rok -->
      <path d="M382 455 L350 610" stroke="#f68b9f" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M402 455 L400 615" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
      <path d="M418 455 L445 610" stroke="#f68b9f" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>

      <!-- Renda Halus Bawah Rok (Cute Scalloped Hem) -->
      <path d="M260 615 Q275 625 295 623 Q315 632 335 628 Q355 636 375 632 Q400 637 425 632 Q445 635 465 628 Q485 630 505 623 Q525 623 540 615" 
            stroke="#fcd34d" stroke-width="4" fill="none"/>
    </g>

    <!-- 2. ATASAN / BLOUSE MAROON ELEGAN (CHIC BLOUSE) -->
    <g transform="translate(0, 0)">
      <!-- Lengan Kiri Mengembang (Puff Sleeve Left) -->
      <path d="M330 265 C285 270 270 310 290 345 C305 365 330 360 340 335 Z" 
            fill="#7b182d" stroke="#380712" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Manset Lengan Kiri -->
      <ellipse cx="316" cy="348" rx="20" ry="7" fill="#fcd34d" stroke="#380712" stroke-width="2.5"/>

      <!-- Lengan Kanan Mengembang (Puff Sleeve Right) -->
      <path d="M470 265 C515 270 530 310 510 345 C495 365 470 360 460 335 Z" 
            fill="#7b182d" stroke="#380712" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Manset Lengan Kanan -->
      <ellipse cx="484" cy="348" rx="20" ry="7" fill="#fcd34d" stroke="#380712" stroke-width="2.5"/>

      <!-- Badan Blouse (Bustier & Waistline) -->
      <path d="M330 265 
               C350 255 450 255 470 265 
               C480 315 475 380 465 440 
               C430 445 370 445 335 440 
               C325 380 320 315 330 265 Z" 
            fill="url(#maroonBlouse)" stroke="#380712" stroke-width="5" stroke-linejoin="round"/>

      <!-- Kerah Manis Peter Pan / Scallop Collar (Warna Krem Sutra) -->
      <path d="M400 280 C380 260 350 255 335 268 C345 295 385 300 400 280 Z" 
            fill="#fff8ee" stroke="#78350f" stroke-width="3"/>
      <path d="M400 280 C420 260 450 255 465 268 C455 295 415 300 400 280 Z" 
            fill="#fff8ee" stroke="#78350f" stroke-width="3"/>
      <!-- Jahitan Renda Kerah -->
      <path d="M340 274 Q365 295 395 282" stroke="#fcd34d" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
      <path d="M460 274 Q435 295 405 282" stroke="#fcd34d" stroke-width="2" stroke-dasharray="3 3" fill="none"/>

      <!-- Kancing Mutiara Emas Berkilau di Depan -->
      <g fill="#fef08a" stroke="#854d0e" stroke-width="2">
        <circle cx="400" cy="305" r="7"/>
        <circle cx="398" cy="303" r="2" fill="#fff"/>
        <circle cx="400" cy="345" r="7"/>
        <circle cx="398" cy="343" r="2" fill="#fff"/>
        <circle cx="400" cy="385" r="7"/>
        <circle cx="398" cy="383" r="2" fill="#fff"/>
        <circle cx="400" cy="420" r="7"/>
        <circle cx="398" cy="418" r="2" fill="#fff"/>
      </g>

      <!-- Garis Kilau Sutra Kartun Pada Blouse -->
      <path d="M352 285 C345 335 348 395 352 430" stroke="#fca5a5" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M448 285 C455 335 452 395 448 430" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M375 320 C370 360 372 400 375 435" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- 3. PITA EMAS PENGIKAT PINGGANG (GOLD WAIST SASH & BOW) -->
      <!-- Ikat Pinggang Emas -->
      <rect x="330" y="432" width="140" height="16" rx="4" fill="url(#goldSash)" stroke="#78350f" stroke-width="3"/>
      
      <!-- Simpul Pita Emas Besar di Pinggang Samping -->
      <g transform="translate(435, 440)">
        <!-- Sayap Pita Kiri -->
        <path d="M0 0 C-18 -18 -32 -6 -20 10 C-10 14 -3 3 0 0 Z" fill="url(#goldSash)" stroke="#78350f" stroke-width="3"/>
        <path d="M-4 -2 C-14 -10 -22 -2 -14 6 Z" fill="#fff" opacity="0.7"/>
        <!-- Sayap Pita Kanan -->
        <path d="M0 0 C18 -18 32 -6 20 10 C10 14 3 3 0 0 Z" fill="url(#goldSash)" stroke="#78350f" stroke-width="3"/>
        <path d="M4 -2 C14 -10 22 -2 14 6 Z" fill="#fff" opacity="0.7"/>
        <!-- Ekor Pita Menjuntai -->
        <path d="M-5 4 Q-12 35 -18 50 Q-8 40 -2 12 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
        <path d="M5 4 Q12 40 18 55 Q8 42 2 12 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
        <!-- Simpul Tengah -->
        <circle cx="0" cy="0" r="9" fill="#fef08a" stroke="#78350f" stroke-width="3"/>
        <circle cx="-2" cy="-2" r="3" fill="#fff"/>
      </g>
    </g>

    <!-- KALUNG MUTIARA ELEGAN DI LEHER MANEKEN -->
    <g transform="translate(400, 248)">
      <path d="M-45 0 C-25 22 25 22 45 0" stroke="#fdfaf2" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 10" fill="none" filter="drop-shadow(0 2px 3px #00000025)"/>
      <!-- Liontin Hati Emas Kecil -->
      <path d="M0 16 C0 13 4 13 5 16 C6 13 10 13 10 16 C10 20 0 26 0 26 C0 26 -10 20 -10 16 C-10 13 -6 13 -5 16 Z" 
            fill="#f59e0b" stroke="#78350f" stroke-width="2" transform="translate(0, 0) scale(0.9)"/>
    </g>

    <!-- HANGING BOUTIQUE TAG "FOR MY FUTURE WIFE" -->
    <g transform="translate(265, 360) rotate(-14)">
      <!-- Tali Tag -->
      <path d="M0 0 Q-15 -35 25 -65" stroke="#927343" stroke-width="2" fill="none"/>
      <!-- Kartu Tag Kartun -->
      <rect x="-35" y="0" width="70" height="100" rx="6" fill="#fffdfa" stroke="#cbb89d" stroke-width="3" filter="drop-shadow(0 4px 6px #5e3b2c20)"/>
      <!-- Lubang Ring Tag -->
      <circle cx="0" cy="15" r="5" fill="#f6eedf" stroke="#927343" stroke-width="2"/>
      <path d="M-22 35 L22 35" stroke="#88283f" stroke-width="1.5"/>
      <text x="0" y="52" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="11" font-weight="bold" fill="#88283f" text-anchor="middle">
        MAROON
      </text>
      <text x="0" y="68" font-family="'Comic Sans MS', 'Fredoka', cursive, sans-serif" font-size="10" font-weight="bold" fill="#6d5852" text-anchor="middle">
        SPECIAL SET
      </text>
      <!-- Hati di Tag -->
      <path d="M0 80 C0 78 3 78 4 80 C5 78 8 78 8 80 C8 83 0 87 0 87 C0 87 -8 83 -8 80 C-8 78 -5 78 -4 80 Z" fill="#e11d48"/>
    </g>
  </g>

  <!-- ==================== LABEL PITA KARTUN DI ATAS ==================== -->
  <g transform="translate(400, 115)">
    <rect x="-165" y="-30" width="330" height="60" rx="30" fill="#88283f" stroke="#5a1524" stroke-width="4.5" filter="url(#dressShadow)"/>
    <rect x="-155" y="-22" width="310" height="44" rx="22" fill="none" stroke="#f4b5c2" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="0" y="7" font-family="'Comic Sans MS', 'Fredoka', 'Quicksand', 'Caveat', cursive, sans-serif" 
          font-size="25" font-weight="bold" fill="#fffdfa" text-anchor="middle" letter-spacing="1.2">
      BAJU SET MAROON ♡
    </text>
  </g>

  <!-- Tag Kaki di Bawah -->
  <g transform="translate(400, 725)">
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#fff" stroke="#d5b4a5" stroke-width="3" filter="drop-shadow(0 4px 6px #5e3b2c15)"/>
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#8a2339" text-anchor="middle" letter-spacing="0.8">
      SETELAN ANGGUN SERASI
    </text>
  </g>
</svg>
