<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Filter bayangan kartun halus -->
    <filter id="cakeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4a2228" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="bgCakeGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff8f6"/>
      <stop offset="65%" stop-color="#faedf0"/>
      <stop offset="100%" stop-color="#f2dfe4"/>
    </radialGradient>
    <radialGradient id="candleGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffdf79"/>
      <stop offset="70%" stop-color="#f59432"/>
      <stop offset="100%" stop-color="#d64527" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="creamTier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="50%" stop-color="#faeedc"/>
      <stop offset="100%" stop-color="#eed8bf"/>
    </linearGradient>
    <linearGradient id="maroonFrostingCake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b83552"/>
      <stop offset="45%" stop-color="#8d2038"/>
      <stop offset="100%" stop-color="#5a1020"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Latar Belakang Kartun Pastel Hangat -->
  <rect width="800" height="800" fill="url(#bgCakeGlow)"/>

  <!-- Bingkai Dalam Kartun & Garis Putus-Putus -->
  <rect x="36" y="36" width="728" height="728" rx="28" fill="none" stroke="#e8c2cb" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- Polkadot & Hati Mengambang Kartun -->
  <g fill="#f2cbd3" opacity="0.5">
    <circle cx="110" cy="115" r="7"/>
    <circle cx="160" cy="85" r="5"/>
    <circle cx="680" cy="110" r="6"/>
    <circle cx="715" cy="180" r="8"/>
    <circle cx="95" cy="690" r="7"/>
    <circle cx="705" cy="685" r="6"/>
  </g>

  <!-- Hati Romantis Mengambang -->
  <path d="M150 210 C150 190 125 180 110 200 C95 180 70 190 70 210 C70 235 110 255 110 255 C110 255 150 235 150 210 Z" fill="#eb7d94" opacity="0.75" transform="rotate(-12 110 215)"/>
  <path d="M700 270 C700 255 680 248 670 262 C660 248 640 255 640 270 C640 290 670 305 670 305 C670 305 700 290 700 270 Z" fill="#ea8d9e" opacity="0.65" transform="rotate(15 670 275)"/>
  <path d="M660 490 C660 478 645 472 638 482 C630 472 615 478 615 490 C615 506 638 516 638 516 C638 516 660 506 660 490 Z" fill="#f09db0" opacity="0.6" transform="rotate(-8 638 490)"/>

  <!-- Sparkles Kilau Emas Kartun -->
  <g fill="#f59e0b" filter="drop-shadow(0 2px 4px #f59e0b40)">
    <path d="M190 160 Q190 182 212 182 Q190 182 190 204 Q190 182 168 182 Q190 182 190 160 Z"/>
    <path d="M640 170 Q640 195 665 195 Q640 195 640 220 Q640 195 615 195 Q640 195 640 170 Z"/>
    <path d="M130 470 Q130 488 148 488 Q130 488 130 506 Q130 488 112 488 Q130 488 130 470 Z"/>
    <circle cx="225" cy="155" r="4" fill="#fbbf24"/>
    <circle cx="670" cy="470" r="4.5" fill="#fbbf24"/>
  </g>

  <!-- Alas Piring Kue & Meja Pastel -->
  <ellipse cx="400" cy="670" rx="270" ry="75" fill="#ebd6dc" stroke="#d4b2be" stroke-width="4"/>
  <ellipse cx="400" cy="665" rx="250" ry="65" fill="#fbf0f4"/>
  <ellipse cx="400" cy="665" rx="230" ry="55" fill="none" stroke="#e8c7cf" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- ==================== KUE ULANG TAHUN BERTINGKAT KARTUN ==================== -->
  <g filter="url(#cakeShadow)">

    <!-- STAND PIRING KERAMIK / EMAS KARTUN (CAKE STAND) -->
    <!-- Kaki Piring -->
    <path d="M375 620 L355 655 L445 655 L425 620 Z" fill="url(#goldPlate)" stroke="#854d0e" stroke-width="4"/>
    <ellipse cx="400" cy="655" rx="55" ry="14" fill="#ca8a04" stroke="#854d0e" stroke-width="3"/>
    <!-- Piring Bundar Atas -->
    <ellipse cx="400" cy="620" rx="210" ry="42" fill="url(#goldPlate)" stroke="#854d0e" stroke-width="4.5"/>
    <ellipse cx="400" cy="615" rx="198" ry="34" fill="#fffdf5" stroke="#fef08a" stroke-width="2.5"/>

    <!-- TINGKAT 1 / TINGKAT BAWAH KUE (BOTTOM TIER) -->
    <!-- Badan Bolu Bawah -->
    <path d="M250 470 C250 435 550 435 550 470 L550 575 C550 615 250 615 250 575 Z" 
          fill="url(#creamTier)" stroke="#522b17" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="400" cy="470" rx="150" ry="32" fill="#fffcf7" stroke="#522b17" stroke-width="3"/>

    <!-- Pita Beludru Maroon di Tingkat Bawah -->
    <path d="M250 550 C330 580 470 580 550 550 L550 575 C470 605 330 605 250 575 Z" 
          fill="url(#maroonFrostingCake)" stroke="#380712" stroke-width="3.5"/>
    
    <!-- Hiasan Lelehan Krim Kartun Manis di Bawah (Cream Drips) -->
    <path d="M250 475 
             Q270 515 290 480 
             Q310 525 330 480 
             Q355 530 380 480 
             Q405 535 430 480 
             Q455 525 480 480 
             Q505 515 525 480 
             Q540 500 550 475 Z" 
          fill="#ffedf3" stroke="#88283f" stroke-width="3"/>

    <!-- Mutiara Gula Emas di Tingkat Bawah -->
    <g fill="#fef08a" stroke="#854d0e" stroke-width="1.8">
      <circle cx="280" cy="565" r="5"/>
      <circle cx="320" cy="578" r="5"/>
      <circle cx="360" cy="585" r="5"/>
      <circle cx="400" cy="588" r="5"/>
      <circle cx="440" cy="585" r="5"/>
      <circle cx="480" cy="578" r="5"/>
      <circle cx="520" cy="565" r="5"/>
    </g>

    <!-- TINGKAT 2 / TINGKAT ATAS KUE (TOP TIER) -->
    <!-- Badan Bolu Atas -->
    <path d="M295 345 C295 315 505 315 505 345 L505 450 C505 485 295 485 295 450 Z" 
          fill="url(#creamTier)" stroke="#522b17" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="400" cy="345" rx="105" ry="24" fill="#fffcf7" stroke="#522b17" stroke-width="3"/>

    <!-- Pita Beludru Maroon di Tingkat Atas -->
    <path d="M295 425 C350 450 450 450 505 425 L505 448 C450 472 350 472 295 448 Z" 
          fill="url(#maroonFrostingCake)" stroke="#380712" stroke-width="3.5"/>

    <!-- Simpul Pita Maroon Cantik di Tingkat Atas -->
    <g transform="translate(400, 442)">
      <!-- Sayap Pita -->
      <path d="M0 0 C-25 -22 -45 -5 -28 14 C-15 18 -4 4 0 0 Z" fill="#b83552" stroke="#380712" stroke-width="3.5"/>
      <path d="M0 0 C25 -22 45 -5 28 14 C15 18 4 4 0 0 Z" fill="#b83552" stroke="#380712" stroke-width="3.5"/>
      <circle cx="0" cy="2" r="8" fill="#fcd34d" stroke="#854d0e" stroke-width="2.5"/>
      <!-- Ekor Pita -->
      <path d="M-6 8 Q-16 35 -22 46 Q-12 36 -3 14 Z" fill="#881e35" stroke="#380712" stroke-width="2.5"/>
      <path d="M6 8 Q16 35 22 46 Q12 36 3 14 Z" fill="#881e35" stroke="#380712" stroke-width="2.5"/>
    </g>

    <!-- Lelehan Krim Manis di Tingkat Atas -->
    <path d="M295 350 
             Q315 390 335 355 
             Q360 398 385 355 
             Q415 398 440 355 
             Q465 395 485 355 
             L505 350 Z" 
          fill="#ffedf3" stroke="#88283f" stroke-width="3"/>

    <!-- ==================== HIASAN BUAH STROBERI, CERI & BUNGA KRIM ATAS ==================== -->
    <!-- Stroberi & Ceri Segar di Atas Kue -->
    <!-- Ceri Kiri -->
    <g transform="translate(345, 335)">
      <circle cx="0" cy="0" r="14" fill="#e11d48" stroke="#4c0519" stroke-width="3"/>
      <circle cx="-4" cy="-4" r="3.5" fill="#ffffff"/>
      <path d="M0 -12 Q-10 -30 -5 -40" stroke="#15803d" stroke-width="3" fill="none"/>
      <circle cx="-5" cy="-40" r="3" fill="#15803d"/>
    </g>
    <!-- Ceri Kanan -->
    <g transform="translate(455, 335)">
      <circle cx="0" cy="0" r="14" fill="#e11d48" stroke="#4c0519" stroke-width="3"/>
      <circle cx="-4" cy="-4" r="3.5" fill="#ffffff"/>
      <path d="M0 -12 Q10 -30 5 -40" stroke="#15803d" stroke-width="3" fill="none"/>
      <circle cx="5" cy="-40" r="3" fill="#15803d"/>
    </g>

    <!-- Swirl Krim Kocok (Whipped Cream Swirls) -->
    <g fill="#ffffff" stroke="#e5d0ba" stroke-width="2.5">
      <!-- Kiri -->
      <path d="M315 345 C305 330 325 320 335 335 C345 350 325 355 315 345 Z"/>
      <!-- Kanan -->
      <path d="M485 345 C495 330 475 320 465 335 C455 350 475 355 485 345 Z"/>
    </g>

    <!-- ==================== LILIN ULANG TAHUN MENYALA ROMANTIS ==================== -->
    <g transform="translate(400, 260)">
      <!-- Bayangan Lilin -->
      <ellipse cx="0" cy="80" rx="14" ry="5" fill="#3b0f17" opacity="0.4"/>

      <!-- Batang Lilin Belang Pastel Maroon & Emas -->
      <rect x="-10" y="0" width="20" height="80" rx="6" fill="#fffdf7" stroke="#522b17" stroke-width="3.5"/>
      <!-- Belang Spiral Maroon pada Lilin -->
      <path d="M-9 15 L9 30 L9 42 L-9 27 Z" fill="#88283f"/>
      <path d="M-9 45 L9 60 L9 72 L-9 57 Z" fill="#88283f"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="#fef08a" stroke="#522b17" stroke-width="2"/>

      <!-- Sumbu Lilin -->
      <line x1="0" y1="0" x2="0" y2="-16" stroke="#451a03" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Nyala Api Lilin Kartun Hangat (Glowing Flame) -->
      <!-- Aura Cahaya Nyala Api -->
      <circle cx="0" cy="-35" r="45" fill="url(#candleGlow)"/>

      <!-- Lidah Api Luar -->
      <path d="M0 -55 C16 -40 14 -20 0 -14 C-14 -20 -16 -40 0 -55 Z" 
            fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
      <!-- Lidah Api Dalam Kuning Terang -->
      <path d="M0 -48 C10 -38 8 -22 0 -18 C-8 -22 -10 -38 0 -48 Z" fill="#fef08a"/>
      <!-- Inti Api Putih -->
      <ellipse cx="0" cy="-26" rx="3.5" ry="7" fill="#ffffff"/>

      <!-- Percikan Cahaya Bintang dari Lilin -->
      <path d="M-22 -45 Q-22 -35 -14 -35 Q-22 -35 -22 -25 Q-22 -35 -30 -35 Q-22 -35 -22 -45 Z" fill="#fde047"/>
      <path d="M24 -48 Q24 -38 32 -38 Q24 -38 24 -28 Q24 -38 16 -38 Q24 -38 24 -48 Z" fill="#fde047"/>
    </g>
  </g>

  <!-- ==================== LABEL PITA KARTUN DI ATAS ==================== -->
  <g transform="translate(400, 115)">
    <rect x="-160" y="-30" width="320" height="60" rx="30" fill="#88283f" stroke="#5a1524" stroke-width="4.5" filter="url(#cakeShadow)"/>
    <rect x="-150" y="-22" width="300" height="44" rx="22" fill="none" stroke="#f4b5c2" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="0" y="7" font-family="'Comic Sans MS', 'Fredoka', 'Quicksand', 'Caveat', cursive, sans-serif" 
          font-size="25" font-weight="bold" fill="#fffdfa" text-anchor="middle" letter-spacing="1.2">
      BIRTHDAY CAKE SPESIAL ♡
    </text>
  </g>

  <!-- Tag Kaki di Bawah -->
  <g transform="translate(400, 725)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#fff" stroke="#d5b4a5" stroke-width="3" filter="drop-shadow(0 4px 6px #5e3b2c15)"/>
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#8a2339" text-anchor="middle" letter-spacing="0.8">
      TIUP LILIN TERAKHIR SBLM NIKAH
    </text>
  </g>
</svg>
